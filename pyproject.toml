[project]
name = "applecollector"
version = "0.1.0"
description = ""
authors = [{ name = "Christopher Bekos", email = "bekos.christopher@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "cryptography>=44.0.2,<45",
